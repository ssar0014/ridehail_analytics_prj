server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve `api` through Docker's DNS per request (via the variable below), so
    # nginx starts even if the API isn't up yet and follows it across restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite's hashed bundles never change in place
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/admin, /driver, …) all serve the SPA shell
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
