
<style>
#erd { padding: 1rem 0; }
#erd svg { max-width: 100%; }
</style>
<h2 class="sr-only">Entity-relationship diagram for a rideshare data warehouse star schema with one fact table (fact_rides) and seven dimension tables</h2>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#3C3489' : '#EEEDFE',
    primaryBorderColor: dark ? '#AFA9EC' : '#534AB7',
    primaryTextColor: dark ? '#CECBF6' : '#26215C',
    edgeLabelBackground: dark ? '#2C2C2A' : '#F1EFE8',
  },
});
const diagram = `erDiagram
    fact_rides {
        uuid ride_id PK
        int driver_key FK
        int customer_key FK
        int vehicle_key FK
        int pickup_location_key FK
        int dropoff_location_key FK
        int request_date_key FK
        int request_time_key FK
        float distance_km
        float duration_minutes
        float base_fare
        float distance_fare
        float surge_multiplier
        float surge_amount
        float tip
        float taxes
        float total_fare
        float wait_time_minutes
        float driver_rating
        float customer_rating
    }

    dim_driver {
        int driver_key PK
        uuid driver_id
        string first_name
        string last_name
        string phone
        string email
        string license_number
        string status
    }

    dim_customer {
        int customer_key PK
        uuid customer_id
        string first_name
        string last_name
        string phone
        string email
    }

    dim_vehicle {
        int vehicle_key PK
        uuid vehicle_id
        string make
        string model
        int year
        string color
        string plate
        string vehicle_type
        string status
    }

    dim_location {
        int location_key PK
        float lat
        float lon
        string address
        string city
        string region
        string country
    }

    dim_date {
        int date_key PK
        date full_date
        int day
        int month
        int year
        string day_of_week
        boolean is_weekend
        int quarter
    }

    dim_time {
        int time_key PK
        int hour
        int minute
        string time_of_day_bucket
        boolean is_peak_hour
    }

    dim_driver    ||--o{ fact_rides : "drives"
    dim_customer  ||--o{ fact_rides : "takes"
    dim_vehicle   ||--o{ fact_rides : "used in"
    dim_location  ||--o{ fact_rides : "pickup at"
    dim_location  ||--o{ fact_rides : "dropoff at"
    dim_date      ||--o{ fact_rides : "requested on"
    dim_time      ||--o{ fact_rides : "requested at"
`;
const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
