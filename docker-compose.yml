services:
  postgres:
    image: postgres:16
    container_name: ridehail_postgres
    environment:
      POSTGRES_USER: ridehail
      POSTGRES_PASSWORD: ridehail
      POSTGRES_DB: ridehail_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridehail -d ridehail_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: ridehail_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ridehail.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
